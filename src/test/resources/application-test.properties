# Test Profile Configuration
# NOTE: Do NOT set spring.profiles.active here - use @ActiveProfiles("test") on test classes

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable data.sql execution during tests (handled by test setup)
spring.sql.init.mode=never

# JWT Configuration (test secret)
application.security.jwt.secret-key=ZGV2LXRlc3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LXRlc3Qtc2VjcmV0LWtleQ==
application.security.jwt.expiration=86400000

# Disable scheduled jobs during tests
spring.task.scheduling.enabled=false

# Mail - no real emails during tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test